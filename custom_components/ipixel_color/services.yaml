display_text:
  name: Display Text
  description: Display text on the iPIXEL device with custom effects and colors
  target:
    entity:
      integration: ipixel_color
      domain: text
  fields:
    text:
      name: Text
      description: Text to display (max 500 characters)
      required: true
      example: "Hello World"
      selector:
        text:
    effect:
      name: Effect
      description: Display effect for the text
      required: false
      default: "scroll_ltr"
      selector:
        select:
          options:
            - "fixed"
            - "scroll_rtl"
            - "scroll_ltr"
            - "blink"
            - "breeze"
            - "snow"
            - "laser"
    speed:
      name: Speed
      description: Animation speed (1-100)
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    color_fg:
      name: Text Color
      description: Foreground text color
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    color_bg:
      name: Background Color
      description: Background color
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:

display_media:
  name: Display remote media
  description: Download a small public HTTPS PNG or GIF and display it without saving to a hardware slot.
  fields:
    device_id:
      name: Device
      description: iPIXEL display to control.
      required: true
      selector:
        device:
          integration: ipixel_color
    url:
      name: HTTPS media URL
      description: Direct public URL for a PNG or GIF up to 2 MB.
      required: true
      selector:
        text:
          type: url
    fit:
      name: Fit
      description: Fit with black padding or fill the panel by cropping.
      required: false
      default: fit
      selector:
        select:
          options:
            - fit
            - crop

show_slot:
  name: Show existing slot
  description: Display an existing device slot without changing its contents.
  fields:
    device_id:
      name: Device
      description: iPIXEL display to control.
      required: true
      selector:
        device:
          integration: ipixel_color
    slot:
      name: Slot
      description: Existing slot number. Empty slots may cause the device to cycle through stored content.
      required: true
      selector:
        number:
          min: 1
          max: 255
          mode: box
